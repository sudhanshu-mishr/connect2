<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinder Clone</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="{{ url_for('index') }}" class="brand">Tinder Clone</a>
            <div class="nav-links">
                {% if current_user %}
                    <a href="{{ url_for('index') }}">Swipe</a>
                    <a href="#" id="matches-link">Matches</a>
                    <a href="{{ url_for('logout') }}">Logout</a>
                {% else %}
                    <a href="{{ url_for('login_page') }}">Login</a>
                    <a href="{{ url_for('register_page') }}">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container">
        {% if error %}
            <ul class="flashes">
            <li style="color: red; list-style: none;">{{ error }}</li>
            </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </div>
    <script src="{{ url_for('static', path='main.js') }}"></script>
</body>
</html>
