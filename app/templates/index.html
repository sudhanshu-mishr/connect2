{% extends "base.html" %}

{% block content %}
<div id="app-container">
    <div id="card-container">
        <!-- Cards will be injected here by JS -->
        <div class="loading">Loading potential matches...</div>
    </div>
    <div id="controls" class="hidden">
        <button id="nope" class="control-btn">❌</button>
        <button id="like" class="control-btn">💚</button>
    </div>
</div>

<div id="match-modal" class="modal hidden">
    <div class="modal-content">
        <h2>It's a Match!</h2>
        <div class="match-avatars">
            <img src="{{ current_user.image_url or 'https://via.placeholder.com/150' }}" alt="You">
            <img id="matched-user-img" src="" alt="Them">
        </div>
        <p>You and <span id="matched-user-name"></span> liked each other.</p>
        <button id="close-modal">Keep Swiping</button>
    </div>
</div>

<div id="matches-panel" class="hidden">
    <h3>Matches</h3>
    <ul id="matches-list">
        <!-- Matches will be injected here -->
    </ul>
    <button id="close-matches">Close</button>
</div>
{% endblock %}
