services:
  - type: web
    name: tinder-clone
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python init_db.py && gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tinder-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: tinder-db
    plan: free
    databaseName: tinder
    user: tinder
