services:
  - type: web
    name: tinder-clone
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tinder-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: tinder-db
    plan: free
    databaseName: tinder
    user: tinder
